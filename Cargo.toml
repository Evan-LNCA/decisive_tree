[package]
name = "decisive_tree"
version = "1.0.0"
edition = "2024"
description = "Fast flowchart / decision-tree editor"

[dependencies]
eframe = { version = "0.36.2", features = ["glow"] }
egui = { version = "0.36.2", features = ["serde"] }
resvg = "0.45"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
svg2pdf = "0.13.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
